services:
  - type: web
    name: navsstudents
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_NAMES
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: GOOGLE_SHEET_ID
        value: 1grET3-MHCkBXqrBrHL1BIiUnAks0Kh3P4MuOijcPykY
      - key: GOOGLE_SHEET_GID
        value: "0"
      - key: GOOGLE_SHEET_GROUP
        value: 101 СПД
      - key: GOOGLE_SHEET_INTERVAL_MS
        value: "300000"
      - key: SCORE_MAX
        value: "100"
      - key: PROGRESS_HOUR
        value: "19"
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
